<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM CLASSES</title>
<style>
body{margin:0;background:#eef3fa;font:15px Arial;color:#17233c}
.app{max-width:520px;margin:auto;background:#fff;min-height:100vh}
.top{padding:25px 18px;background:linear-gradient(135deg,#1265df,#5b98f5);color:white;border-radius:0 0 25px 25px}
.logo{font-size:29px;font-weight:800}.tag{margin-top:5px}
.main{padding:18px 15px 70px}.screen{display:none}.active{display:block}
.title{font-size:21px;font-weight:800;margin:10px 0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card,.item,.question{padding:15px;border:1px solid #e0e7f0;border-radius:15px;margin-bottom:10px}
.card{background:#f5f8ff}.muted{display:block;font-size:12px;color:#718096;margin-top:5px}
.option{padding:11px;border:1px solid #dce3ee;border-radius:10px;margin-top:8px}
.ok{background:#e7f7ec}.bad{background:#ffeaea}
.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px;box-sizing:border-box;border:1px solid #dce3ee;border-radius:10px}
.field textarea{min-height:75px}.btn{padding:11px 15px;border:0;border-radius:10px;background:#1769e0;color:white;font-weight:bold}
.note{padding:12px;background:#eef7ff;border-radius:10px;font-size:12px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd}
.nav button{padding:10px;border:0;background:none}
</style></head>

<body><div class="app">

<header class="top">
<div class="logo">KM CLASSES</div>
<div class="tag">Learn • Practice • Improve • Succeed</div>
</header>

<main class="main">

<section id="home" class="screen active">
<div class="title">Welcome to KM CLASSES</div>

<div class="grid">

<div class="card" onclick="show('mcq')">
📝<b>MCQ Practice</b>
<span class="muted">Commerce + UGC NET + HTET</span>
</div>

<div class="card" onclick="show('notes')">
📚<b>Notes</b>
<span class="muted">UGC NET Commerce 10 Units</span>
</div>

<div class="card">
🎥<b>Classes</b>
<span class="muted">Live & Recorded</span>
</div>

<div class="card" onclick="show('admin')">
⚙️<b>Admin</b>
<span class="muted">Update MCQs</span>
</div>

</div>
</section>

<section id="mcq" class="screen">
<div class="title">MCQ Practice</div>
<div id="list"></div>
</section>

<section id="notes" class="screen">
<div class="title">Notes</div>
<div id="notesList"></div>
</section>

<section id="admin" class="screen">

<div class="title">Admin Login</div>

<div id="login">

<div class="field">
<label>Username</label>
<input id="u" value="admin">
</div>

<div class="field">
<label>Password</label>
<input id="p" type="password">
</div>

<button class="btn" onclick="login()">Login</button>

</div>

<div id="panel" style="display:none">

<div class="note">
Admin is connected to the server.
</div>

<div class="field">
<label>Exam</label>
<select id="exam">
<option>UGC NET</option>
<option>HTET</option>
</select>
</div>

<div class="field">
<label>Subject</label>
<input id="sub">
</div>

<div class="field">
<label>Question</label>
<textarea id="que"></textarea>
</div>

<div class="field">
<label>Option A</label>
<input id="a">
</div>

<div class="field">
<label>Option B</label>
<input id="b">
</div>

<div class="field">
<label>Option C</label>
<input id="c">
</div>

<div class="field">
<label>Option D</label>
<input id="d">
</div>

<div class="field">
<label>Correct Answer</label>
<select id="ans">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>
</div>

<div class="field">
<label>Explanation</label>
<textarea id="exp"></textarea>
</div>

<button class="btn" onclick="add()">Save MCQ</button>

</div>
</section>

</main>

<nav class="nav">
<button onclick="show('home')">🏠<br>Home</button>
<button onclick="show('mcq')">✓<br>MCQs</button>
<button onclick="show('notes')">▤<br>Notes</button>
<button onclick="show('admin')">⚙️<br>Admin</button>
</nav>

</div>

<script>

const units=[
'Unit 1: Business Environment',
'Unit 2: Accounting & Auditing',
'Unit 3: Business Economics',
'Unit 4: Business Finance',
'Unit 5: Business Management & HRM',
'Unit 6: Marketing Management',
'Unit 7: Business Law',
'Unit 8: Income Tax',
'Unit 9: International Business',
'Unit 10: Statistics & Research Methods'
];

let data={mcqs:[]};

function show(id){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
load();
}

function esc(s){
return String(s||'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));
}

async function load(){

let r=await fetch('/api/content');
data=await r.json();

list.innerHTML=data.mcqs.length?

data.mcqs.map(q=>

'<div class="question">'+
'<span class="muted">'+esc(q.exam)+' • '+esc(q.subject)+'</span>'+
'<p><b>'+esc(q.question)+'</b></p>'+

['A','B','C','D'].map(k=>
'<div class="option" onclick="pick(this,\''+q.answer+'\')">'+
k+'. '+esc(q[k.toLowerCase()])+
'</div>'
).join('')+

'<span class="muted">'+esc(q.explanation||'')+'</span>'+
'</div>'

).join('')

:

'<div class="note">No custom MCQs added yet.</div>';

notesList.innerHTML=

units.map(u=>

'<div class="item">'+
'<b>UGC NET Commerce — '+u+'</b>'+
'<span class="muted">Study & revision notes</span>'+
'</div>'

).join('');

}

function pick(e,r){

if(e.parentElement.dataset.done)return;

e.parentElement.dataset.done=1;

e.classList.add(
e.textContent.trim()[0]===r?'ok':'bad'
);

}

async function login(){

let r=await fetch('/api/admin/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
username:u.value,
password:p.value
})
});

if(r.ok){

login.style.display='none';
panel.style.display='block';

}else{

alert('Invalid username or password');

}

}

async function add(){

let q={
exam:exam.value,
subject:sub.value,
question:que.value,
a:a.value,
b:b.value,
c:c.value,
d:d.value,
answer:ans.value,
explanation:exp.value
};

let r=await fetch('/api/mcqs',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(q)
});

if(r.ok){

alert('MCQ saved');
load();

}else{

alert('Fill question and all options');

}

}

load();

</script>

</body>
  </html>
